name: Import signed initial update grant
on:
  workflow_dispatch:
    inputs:
      bundle_base64:
        description: Public-only bundle from the private preparation checkpoint
        required: true
        type: string
      confirmation:
        description: Type IMPORT INITIAL GRANT
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: initial-update-grant-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main' && github.repository == 'Decian-Inc/Decian-Software-Updates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify public signature and atomically import exact pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_BUNDLE: ${{ inputs.bundle_base64 }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 -I scripts/update_public_import.py
